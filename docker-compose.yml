services:
    website:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                SOURCE_URL: ${SOURCE_URL:-https://gitlab.com/r8vnhill/dibs-astro-website}
                SOURCE_REVISION: ${SOURCE_REVISION:-local}
                IMAGE_VERSION: ${IMAGE_VERSION:-local}
        image: dibs-astro:local
        read_only: true
        tmpfs:
            - /tmp
        ports:
            - "${WEBSITE_PORT:-8080}:8080"
