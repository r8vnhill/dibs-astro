default:
  tags:
    - local
    - docker

stages:
    - prepare
    - test
    - build
    - deploy

variables:
    NODE_VERSION: "24.11.0"
    PNPM_VERSION: "11.8.0"
    PNPM_STORE_DIR: .pnpm-store
    GIT_DEPTH: "20"
    GIT_STRATEGY: fetch
    GIT_CLEAN_FLAGS: -ffdx
    NODE_OPTIONS: --max-old-space-size=3072
    ASTRO_TELEMETRY_DISABLED: "1"
    SKIP_ICON_GENERATION: "true"

.node-job:
    image: node:${NODE_VERSION}-alpine
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH'
        - if: '$CI_COMMIT_TAG'
    before_script:
        - npm config set fetch-retries 5
        - npm config set fetch-retry-mintimeout 20000
        - npm config set fetch-retry-maxtimeout 120000
        - corepack enable
        - corepack prepare pnpm@${PNPM_VERSION} --activate || npm install --global pnpm@${PNPM_VERSION}
        - pnpm config set store-dir ${PNPM_STORE_DIR}
        - pnpm config set //gitlab.com/api/v4/projects/85350050/packages/npm/:_authToken ${CI_JOB_TOKEN}
        - pnpm install --frozen-lockfile

deps:
    stage: prepare
    extends: .node-job
    tags:
        - local
        - docker
    script:
        - pnpm --version

test:check:
    stage: test
    extends: .node-job
    tags:
        - local
        - docker
    needs:
        - job: deps
    script:
        - pnpm check

test:unit:
    stage: test
    extends: .node-job
    tags:
        - local
        - docker
    needs:
        - job: deps
    script:
        - pnpm run build:content-core
        - pnpm run build:site-core
        - pnpm exec vitest run --config vitest.config.ts

test:astro-render:
    stage: test
    extends: .node-job
    tags:
        - local
        - docker
    needs:
        - job: deps
    script:
        - pnpm run build:content-core
        - pnpm run build:site-core
        - pnpm exec vitest run --config vitest.astro.config.ts

test:e2e:
    stage: test
    extends: .node-job
    image: node:${NODE_VERSION}-bookworm
    tags:
        - local
        - docker
    needs:
        - job: deps
    script:
        - pnpm exec playwright install --with-deps chromium
        - pnpm run i18n:compile
        - pnpm run build:content-core
        - pnpm run build:lesson-export-core
        - pnpm run build:site-core
        - pnpm run build:shiki-core
        - pnpm run generate:bibliography-catalog
        - pnpm run generate:lesson-metadata
        - pnpm exec playwright test
    artifacts:
        when: always
        paths:
            - playwright-report/
            - test-results/
        expire_in: 7 days

pdf_export_smoke:
    stage: test
    extends: .node-job
    tags:
        - local
        - docker
    needs:
        - job: deps
          optional: true
    allow_failure: true
    rules:
        - if: '$EXPORT_PDF_SMOKE == "1"'
          when: on_success
        - when: manual
          allow_failure: true
    script:
        - pnpm playwright:install
        - EXPORT_PDF_SMOKE=1 pnpm test:pdf-smoke
    artifacts:
        when: always
        paths:
            - tmp/pdf-export-smoke/
        expire_in: 7 days

build:
    stage: build
    extends: .node-job
    tags:
        - local
        - docker
    variables:
        GIT_DEPTH: "0"
        NODE_OPTIONS: --max-old-space-size=3072
        ASTRO_TELEMETRY_DISABLED: "1"
        UV_THREADPOOL_SIZE: "2"
    needs:
        - job: deps
        - job: test:check
        - job: test:unit
        - job: test:astro-render
        - job: test:e2e
    script:
        - apk add --no-cache git
        - pnpm build
    artifacts:
        paths:
            - dist/
        expire_in: 1 week

deploy:
    stage: deploy
    extends: .node-job
    tags:
        - local
        - docker
    variables:
        NODE_OPTIONS: --max-old-space-size=3072
        ASTRO_TELEMETRY_DISABLED: "1"
    needs:
        - job: deps
        - job: test:check
        - job: test:unit
        - job: test:astro-render
        - job: test:e2e
        - job: build
          artifacts: true
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
          when: on_success
        - if: '$CI_COMMIT_TAG'
          when: manual
        - when: never
    script:
        - pnpm exec wrangler deploy
    environment:
        name: production
