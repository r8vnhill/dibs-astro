# Local example only. Never put runner authentication tokens in this file.
# Keep the real config.toml outside version control.

concurrent = 1
check_interval = 0

[[runners]]
  name = "dibs-local-windows-docker-runner"
  url = "https://gitlab.com/"
  token = "<configure-in-gitlab-and-store-locally>"
  executor = "docker"

  [runners.docker]
    image = "node:24.11.0-alpine"
    privileged = false
    volumes = ["/cache"]
