# Custom build plans for the two proportional-text candidates. The source release is pinned in
# upstream.json; keep these plans together so their shared Iosevka design space remains explicit.
# Plan identifiers are stable tooling inputs; `family` supplies the generated font family name.

# Body/UI candidate: the sans-serif branch of the quasi-proportional design space.
# Its dimensions cover the body contract's regular, italic, medium, and bold states without oblique slopes.
[buildPlans.dibs-sans]
exportGlyphNames = false
family = "DIBS Sans"
serifs = "sans"
spacing = "quasi-proportional"
webfontFormats = ["WOFF2"]

# Cherry-picks only the calt groups needed for the technical-ligature corpus; no preset is
# inherited, so nothing beyond this list is enabled. See README.md's "Ligature configuration"
# section for the sequence-to-group mapping and the fi/fl/ffi/ffl caveat.
[buildPlans.dibs-sans.ligations]
enables = [
  "arrow-l-hyphen",
  "arrow-lr-hyphen",
  "arrow-r-equal",
  "arrow-r-hyphen",
  "eqeq",
  "exeq",
  "gteq",
  "lteq",
]

[buildPlans.dibs-sans.weights.Regular]
css = 400
menu = 400
shape = 400

[buildPlans.dibs-sans.weights.Medium]
css = 500
menu = 500
shape = 500

[buildPlans.dibs-sans.weights.Bold]
css = 700
menu = 700
shape = 700

[buildPlans.dibs-sans.slopes.Upright]
angle = 0
css = "normal"
menu = "upright"
shape = "upright"

[buildPlans.dibs-sans.slopes.Italic]
angle = 9.4
css = "italic"
menu = "italic"
shape = "italic"

[buildPlans.dibs-sans.widths.Normal]
shape = 500
menu = 5
css = "normal"

# Heading candidate: the slab-serif branch of the same quasi-proportional design space.
# Headings require only medium and bold upright states, so no italic or oblique slope is declared.
[buildPlans.dibs-slab]
exportGlyphNames = false
family = "DIBS Slab"
serifs = "slab"
spacing = "quasi-proportional"
webfontFormats = ["WOFF2"]

# Same minimal ligation-group cherry-pick as dibs-sans; see the comment there and README.md.
[buildPlans.dibs-slab.ligations]
enables = [
  "arrow-l-hyphen",
  "arrow-lr-hyphen",
  "arrow-r-equal",
  "arrow-r-hyphen",
  "eqeq",
  "exeq",
  "gteq",
  "lteq",
]

[buildPlans.dibs-slab.weights.Medium]
css = 500
menu = 500
shape = 500

[buildPlans.dibs-slab.weights.Bold]
css = 700
menu = 700
shape = 700

[buildPlans.dibs-slab.slopes.Upright]
angle = 0
css = "normal"
menu = "upright"
shape = "upright"

[buildPlans.dibs-slab.widths.Normal]
shape = 500
menu = 5
css = "normal"
